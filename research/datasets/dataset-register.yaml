  - id: grouvel_2023
    title: "A dataset of asymptomatic human gait and movements obtained from markers, IMUs, insoles and force plates"
    source_url: "https://doi.org/10.1038/s41597-023-02077-3"
    published: "2023"
    license: "CC-BY-4.0"
    participants: 10
    sensor_locations: [feet, shanks, thighs, pelvis, trunk]
    sensor_hardware: "IMUs (Physilog6S, GaitUp); insoles (Moticon); force plates (AMTI); mocap markers"
    sampling_rate_hz: 256
    ground_truth: "3 force plates (1000 Hz) + mocap; 2 running trials per subject"
    role: recommended_followup
    caveat: "Only 2 running trials per subject; IMU-to-optoelectronic sync ~0.1 s."
    status: characterized_not_acquired

  - id: fukuchi_rbds
    title: "A public dataset of running biomechanics (RBDS)"
    source_url: "https://bmclab.pesquisa.ufabc.edu.br/datasets/rbds/"
    doi_data: "10.6084/m9.figshare.4543435"
    paper: "Fukuchi RK et al. (2017) PeerJ 5: e3298, https://doi.org/10.7717/peerj.3298"
    license: "CC-BY-4.0"
    participants: 28
    sensor_locations: []
    sensor_hardware: "None (mocap + instrumented treadmill only)"
    ground_truth: "Mocap (12 cameras, 48 markers) + Bertec dual-belt force plates; speeds 2.5/3.5/4.5 m/s"
